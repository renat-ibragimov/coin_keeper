[project]
name = "coinkeeper-backend"
version = "0.1.0"
description = "CoinKeeper API — coin collection tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "aiosmtplib>=3.0",
    "boto3>=1.35",
    "pillow>=11.0",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-boto3>=1.35",
    "mypy-boto3-s3>=1.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# RUF001 is allowed in tests: assertions quote Ukrainian coin, country and
# series names — data, which the language policy in CLAUDE.md exempts.
# Comments and docstrings (RUF002/RUF003) still must be plain English.
"tests/*" = ["S105", "S106", "RUF001"]
# The legacy fixture carries Ukrainian and Russian coin titles on purpose: the
# migration has to survive non-ASCII data, and Cyrillic letters that look like
# Latin ones are exactly what the real database contains. This is data, not
# code, and the language policy in CLAUDE.md exempts coin, country and series
# names for that reason.
"tests/fixtures/build_legacy_db.py" = ["RUF001", "RUF002", "RUF003"]
# Same exemption for the API test seed: Ukrainian coin and series names are data.
"tests/seed.py" = ["RUF001", "RUF002", "RUF003"]
# A migration docstring quotes the data it is about: Russian titles,
# Ukrainian material strings. Same exemption as the parsers below.
"alembic/versions/*" = ["E501", "RUF001", "RUF002", "RUF003"]
# Country endonyms, denomination words and the material phrases the sources
# print are data too, same exemption as the reconnaissance parsers.
"app/reference_data/*" = ["RUF001", "RUF002", "RUF003"]
# The reconnaissance parsers select cells by the Ukrainian labels the sites
# print ("Назва", "Тираж"); those literals are the sites' data, not prose.
"app/ukraine_recon/*" = ["RUF001", "RUF002", "RUF003"]
# Same for the pipeline: the lexicon and the parsers quote the two languages
# they compare, letter by letter.
"app/ukraine_pipeline/*" = ["RUF001", "RUF002", "RUF003"]
"scripts/ukraine_pipeline.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/recon_ukraine.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]
plugins = []

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the engine and the test database are
# session-scoped, and a per-test loop would leave them bound to a dead loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
