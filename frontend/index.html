<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bakost Numismatics</title>
    <meta
      name="description"
      content="Bakost Numismatics — каталог монет, особиста колекція, покупки та ринкові ціни."
    />
    <meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110c" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bakost Numismatics" />
    <meta property="og:title" content="Bakost Numismatics" />
    <meta
      property="og:description"
      content="Каталог монет, особиста колекція, покупки та ринкові ціни."
    />
    <meta
      property="og:image"
      content="https://coins.renat-ibragimov.com/brand/logo-full-1600.png"
    />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="657" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Numismatics" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem('ck-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
