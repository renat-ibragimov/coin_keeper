<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoinKeeper · вход uCoin</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #08090b;
        color: #f4f3ef;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 70% 15%, rgba(215, 178, 115, .20), transparent 32%),
          radial-gradient(circle at 20% 90%, rgba(82, 122, 181, .16), transparent 34%),
          #08090b;
      }
      .card {
        width: min(520px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(24,26,31,.94), rgba(13,14,17,.92));
        box-shadow: 0 32px 120px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.04);
      }
      .coin {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        margin-bottom: 18px;
        border-radius: 16px;
        color: #17130c;
        background: linear-gradient(145deg, #f2d495, #bc8f4d);
        box-shadow: 0 12px 34px rgba(215,178,115,.22), inset 0 1px rgba(255,255,255,.55);
        font-size: 24px;
      }
      .eyebrow {
        color: #767c87;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 8px;
        font-size: 27px;
        line-height: 1.15;
        letter-spacing: -.55px;
      }
      p {
        margin: 0;
        color: #8e949f;
        font-size: 14px;
        line-height: 1.65;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      a, button {
        min-height: 42px;
        padding: 0 15px;
        border-radius: 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      a.primary, button.primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,.16);
        color: #17130c;
        background: linear-gradient(145deg, #f0d092, #c69a56);
      }
      button.secondary {
        border: 1px solid rgba(255,255,255,.10);
        color: #c8cbd0;
        background: rgba(255,255,255,.045);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 18px;
        color: #747b86;
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #d7b273;
        box-shadow: 0 0 18px rgba(215,178,115,.9);
        animation: pulse 1.1s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: .45; transform: scale(.85); }
        50% { opacity: 1; transform: scale(1.08); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="coin">◉</div>
      <span class="eyebrow">CoinKeeper · uCoin</span>
      <h1>Открываю страницу входа uCoin</h1>
      <p>Если переход не начался сам, нажми кнопку ниже. После входа включи “запомнить меня” — сессия сохранится в профиле CoinKeeper.</p>
      <div class="actions">
        <a class="primary" id="open" href="https://ru.ucoin.net/">Открыть uCoin</a>
        <button class="secondary" type="button" onclick="location.reload()">Повторить</button>
      </div>
      <div class="status"><i class="dot"></i><span>Переход на ru.ucoin.net…</span></div>
    </main>
    <script>
      setTimeout(() => {
        window.location.replace("https://ru.ucoin.net/");
      }, 500);
    </script>
  </body>
</html>
